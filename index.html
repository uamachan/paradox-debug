<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ぱらぐら デバッグ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#eef0f3; --surface:#ffffff; --ink:#15181e; --muted:#5d6573; --line:#d6dae1;
  --accent:#2f5bd8; --accent-ink:#ffffff;
  --ok:#1f8a4c; --ok-soft:#dff3e7; --bug:#c8362f; --bug-soft:#fbe3e1; --later:#a8680b; --later-soft:#fbefd9;
  --warn-bg:#fff4cf; --warn-ink:#6b4d00;
  --done:#9aa1ad;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101318; --surface:#1a1e26; --ink:#e8ebf0; --muted:#9199a7; --line:#2c323d;
    --accent:#7b9cff; --accent-ink:#0d1220;
    --ok:#46c27b; --ok-soft:#173424; --bug:#ff6b61; --bug-soft:#3a1c1a; --later:#f0b24a; --later-soft:#382a12;
    --warn-bg:#3a3214; --warn-ink:#ffe08a; --done:#5d6573;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#1a1e26; --ink:#e8ebf0; --muted:#9199a7; --line:#2c323d;
  --accent:#7b9cff; --accent-ink:#0d1220;
  --ok:#46c27b; --ok-soft:#173424; --bug:#ff6b61; --bug-soft:#3a1c1a; --later:#f0b24a; --later-soft:#382a12;
  --warn-bg:#3a3214; --warn-ink:#ffe08a; --done:#5d6573;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:0 140px}
.wrap{max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:17px;font-weight:900;margin:0;letter-spacing:.02em}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:transparent;padding:6px 10px;border-radius:8px;font-size:14px;color:var(--muted);font-weight:700}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-bug{background:var(--bug)}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px}
.sec{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:500}
.name{font-family:var(--mono);font-size:clamp(24px,6vw,32px);font-weight:700;line-height:1.2;word-break:break-all;margin:0}
.again{font-size:13px;color:var(--later);font-weight:700}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.steps button{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:transparent;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:17px;font-weight:500}
.steps .box{flex:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;margin-top:2px;display:grid;place-items:center;font-size:14px;color:var(--accent-ink)}
.steps button[aria-pressed="true"]{color:var(--done);text-decoration:line-through}
.steps button[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.hint{font-size:13px;color:var(--muted);display:grid;gap:4px}
.hint span{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line);margin:2px 4px 2px 0}
.note{background:var(--bug-soft);color:var(--bug);border-radius:8px;padding:8px 12px;font-size:14px}

.actions{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.actions .row{max-width:640px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}
.actions button{border:0;border-radius:12px;padding:14px 6px;font-weight:900;font-size:16px;display:grid;gap:0;justify-items:center}
.actions small{font-family:var(--mono);font-size:11px;font-weight:500;opacity:.7}
.a-ok{background:var(--ok);color:#fff}
.a-bug{background:var(--bug);color:#fff}
.a-later{background:var(--later-soft);color:var(--later)}
.a-undo{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.actions button:disabled{opacity:.4;cursor:default}

.sheet{display:grid;gap:12px;border-top:1px dashed var(--line);padding-top:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-size:14px}
.tags button[aria-pressed="true"]{background:var(--bug);border-color:var(--bug);color:#fff}
textarea,input[type=password],input[type=text]{width:100%;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:70px;resize:vertical}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.btn.red{background:var(--bug);color:#fff}

.list{display:grid;gap:18px}
.list h2{font-size:14px;margin:0 0 6px;color:var(--muted)}
.list ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.list li button{width:100%;text-align:left;background:transparent;border:0;padding:10px 14px;display:flex;gap:10px;align-items:baseline}
.list .nm{font-family:var(--mono);font-size:14px;font-weight:700;word-break:break-all}
.list .bn{display:block;font-size:13px;color:var(--bug);font-family:var(--sans);font-weight:500}
.mk{flex:none;font-size:12px;font-weight:900;border-radius:6px;padding:1px 6px;min-width:44px;text-align:center}
.mk-x{background:var(--ok-soft);color:var(--ok)} .mk-b{background:var(--bug-soft);color:var(--bug)}
.mk-l{background:var(--later-soft);color:var(--later)} .mk-n{background:var(--bg);color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:30px 0}

.setup{display:grid;gap:12px}
.setup ol{margin:0;padding-left:20px;display:grid;gap:4px}
.setup code{font-family:var(--mono);font-size:13px;background:var(--bg);padding:1px 5px;border-radius:4px;word-break:break-all}
.setup a{color:var(--accent)}
.err{color:var(--bug);font-size:14px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
.foot button{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12px}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;font-weight:700;z-index:9;transition:opacity .2s;pointer-events:none}
.toast.hide{opacity:0}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:420px){.actions button{font-size:15px;padding:12px 4px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1>ぱらぐら デバッグ</h1>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="now" aria-selected="true">今の1個</button>
        <button role="tab" data-tab="list" aria-selected="false">一覧</button>
        <button role="tab" data-tab="bugs" aria-selected="false">バグ</button>
      </nav>
    </div>
    <div class="bar" id="bar"><i class="b-ok" style="width:0"></i><i class="b-bug" style="width:0"></i></div>
    <div class="stats" id="stats">読み込み中…</div>
  </header>

  <main id="main"></main>
  <div class="foot" id="foot" hidden>
    <span id="src"></span> · <button id="reload">再読み込み</button> · <button id="logout">トークンを消す</button>
  </div>
</div>

<div class="actions" id="actions" hidden>
  <div class="row">
    <button class="a-ok" id="bOk">OK<small>Enter</small></button>
    <button class="a-bug" id="bBug">バグ<small>X</small></button>
    <button class="a-later" id="bLater">あとで<small>S</small></button>
    <button class="a-undo" id="bUndo">戻す<small>B</small></button>
  </div>
</div>
<div class="toast hide" id="toast"></div>

<script>
const OWNER = 'uamachan', REPO = 'paradoxcityy', PATH = 'docs/debug/checklist.md', BRANCH = 'master';
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
const TAGS = ['暗転が戻らない', 'カメラが戻らない', 'マウスカーソルが残る/出ない', '固まって動けない', 'アニメが止まらない', '持ち物(プロップ)が残る', '次の1回が始められない'];
const NOTE_RE = /^  - バグ: (.*)$/;
const ITEM_RE = /^- \[(.)\] (.+?)(?: — (.+))?$/;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let token = store.get('gh_token');
let lines = [], sha = null, items = [];
let tab = 'now', pick = null, busy = false, bugOpen = false, bugTags = new Set();
let undo = [];
let checked = new Set();
const today = new Date().toISOString().slice(0, 10);
let done = +(store.get('done_' + today) || 0);

function parse() {
  items = []; let sec = '', notes = [];
  lines.forEach((l, i) => {
    let m;
    if ((m = l.match(/^## (.+)$/))) { sec = m[1]; notes = []; return; }
    if ((m = l.match(/^> (.+)$/))) { notes.push(m[1]); return; }
    if ((m = l.match(ITEM_RE))) {
      const bugs = [];
      for (let j = i + 1; j < lines.length && NOTE_RE.test(lines[j]); j++) bugs.push(lines[j].match(NOTE_RE)[1]);
      items.push({ line: i, mark: m[1], name: m[2], steps: m[3] || '', sec, notes: [...notes], bugs });
    }
  });
}

function setMark(name, mark, bugs) {
  const it = items.find(x => x.name === name);
  if (!it) throw new Error(`${name} がファイルに無い`);
  lines[it.line] = lines[it.line].replace(/^- \[.\]/, `- [${mark}]`);
  let n = 0; while (NOTE_RE.test(lines[it.line + 1 + n] || '')) n++;
  lines.splice(it.line + 1, n, ...bugs.map(b => `  - バグ: ${b}`));
  parse();
}

function b64dec(s) {
  const bin = atob(s.replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
function b64enc(s) {
  const bytes = new TextEncoder().encode(s); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

async function gh(method, body) {
  const url = method === 'GET' ? `${API}?ref=${BRANCH}&t=${Date.now()}` : API;
  const r = await fetch(url, {
    method, cache: 'no-store',
    headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
    body: body && JSON.stringify(body)
  });
  if (!r.ok) { const e = new Error(r.status === 401 ? 'トークンが無効' : r.status === 404 ? 'ファイルが見えない (トークンの権限を確認)' : `GitHub ${r.status}`); e.status = r.status; throw e; }
  return r.json();
}

async function load() {
  const j = await gh('GET');
  sha = j.sha;
  lines = b64dec(j.content).replace(/\n$/, '').split('\n');
  parse();
}

// 他で更新されていたら (409) 読み直して同じ変更をやり直す
async function commit(name, mark, bugs, msg) {
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      setMark(name, mark, bugs);
      const j = await gh('PUT', { message: msg, content: b64enc(lines.join('\n') + '\n'), sha, branch: BRANCH });
      sha = j.content.sha;
      return j.commit.sha.slice(0, 7);
    } catch (e) {
      if ((e.status === 409 || e.status === 422) && attempt === 0) { await load(); continue; }
      throw e;
    }
  }
}

function current() {
  if (pick) { const p = items.find(x => x.name === pick); if (p) return p; }
  return items.find(x => x.mark === ' ') || items.find(x => x.mark === '-') || null;
}

let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hide');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hide'), 1800);
}

async function act(kind) {
  const cur = current(); if (!cur || busy) return;
  if (kind === 'bug' && !bugOpen) { bugOpen = true; bugTags = new Set(); render(); setTimeout(() => $('#bugText')?.focus(), 0); return; }
  let mark, bugs = [], msg;
  if (kind === 'ok') { mark = 'x'; msg = `debug: ${cur.name} OK`; }
  if (kind === 'later') { mark = '-'; msg = `debug: ${cur.name} あとで`; }
  if (kind === 'bug') {
    const txt = [...bugTags].map(i => TAGS[i]).concat(($('#bugText').value || '').trim()).filter(Boolean).join(' / ');
    if (!txt) { toast('何が起きたか選ぶか書いて'); return; }
    mark = '!'; bugs = [txt]; msg = `debug: ${cur.name} バグ - ${txt}`;
  }
  undo.push({ name: cur.name, mark: cur.mark, bugs: cur.bugs });
  busy = true; render();
  try {
    const c = await commit(cur.name, mark, bugs, msg);
    done++; store.set('done_' + today, done);
    pick = null; bugOpen = false; checked = new Set();
    toast(`${kind === 'ok' ? 'OK' : kind === 'bug' ? 'バグ記録' : 'あとで'} · commit ${c}`);
  } catch (e) { undo.pop(); toast('保存失敗: ' + e.message); await safeLoad(); }
  busy = false; render();
}

async function doUndo() {
  const u = undo.at(-1); if (!u || busy) return;
  busy = true; render();
  try {
    const c = await commit(u.name, u.mark, u.bugs, `debug: ${u.name} 戻す`);
    undo.pop(); done = Math.max(0, done - 1); store.set('done_' + today, done);
    pick = u.name; bugOpen = false; checked = new Set();
    toast(`戻した · commit ${c}`);
  } catch (e) { toast('戻せなかった: ' + e.message); await safeLoad(); }
  busy = false; render();
}

async function safeLoad() { try { await load(); } catch (e) { toast(e.message); } }

function markChip(m) {
  return { x: '<span class="mk mk-x">OK</span>', '!': '<span class="mk mk-b">バグ</span>', '-': '<span class="mk mk-l">あとで</span>', ' ': '<span class="mk mk-n">未</span>' }[m] || '';
}

function renderHead() {
  const n = items.length, ok = items.filter(x => x.mark === 'x').length, bug = items.filter(x => x.mark === '!').length, later = items.filter(x => x.mark === '-').length;
  const [bo, bb] = $('#bar').children;
  bo.style.width = n ? (ok / n * 100) + '%' : 0; bb.style.width = n ? (bug / n * 100) + '%' : 0;
  $('#stats').innerHTML = `<span><b>${ok + bug}</b> / ${n} 済</span><span>OK <b>${ok}</b></span><span>バグ <b>${bug}</b></span><span>あとで <b>${later}</b></span><span>今日 <b>${done}</b> 個</span>`;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
}

function renderNow() {
  const cur = current();
  if (!cur) return `<div class="card"><p class="name">全部終わった</p><p class="sec">バグは「バグ」タブで確認</p></div>`;
  const steps = cur.steps ? cur.steps.split('、') : [];
  return `<div class="card">
    <div class="sec">${esc(cur.sec)}</div>
    ${cur.notes.map(n => `<div class="warn">先にやる: ${esc(n)}</div>`).join('')}
    <h2 class="name">${esc(cur.name)}</h2>
    ${cur.mark === '-' ? '<div class="again">あとで に回したやつ</div>' : ''}
    ${cur.mark === 'x' || cur.mark === '!' ? `<div class="again">いま: ${cur.mark === 'x' ? 'OK' : 'バグ'} (やり直し中)</div>` : ''}
    ${cur.bugs.map(b => `<div class="note">前のバグ: ${esc(b)}</div>`).join('')}
    <ol class="steps">${steps.map((s, i) => `<li><button data-step="${i}" aria-pressed="${checked.has(i)}"><span class="box">${checked.has(i) ? '✓' : ''}</span><span>${esc(s)}</span></button></li>`).join('')}</ol>
    <div class="hint">
      <div>各操作で: <span>成功</span><span>ESC・X</span><span>途中で死亡</span><span>切断→再接続</span></div>
      <div>見る所: <span>暗転</span><span>カメラ</span><span>カーソル</span><span>固まり</span><span>アニメ</span><span>持ち物</span><span>次の1回</span></div>
    </div>
    ${bugOpen ? `<div class="sheet">
      <div class="sec">何が起きた? (複数OK)</div>
      <div class="tags">${TAGS.map((t, i) => `<button data-tag="${i}" aria-pressed="${bugTags.has(i)}">${i + 1}. ${esc(t)}</button>`).join('')}</div>
      <textarea id="bugText" placeholder="一言メモ (例: ESC で閉じたらカーソルが残った)"></textarea>
      <div class="btnrow"><button class="btn red" id="bugSend">バグで記録</button><button class="btn ghost" id="bugCancel">やめる</button></div>
    </div>` : ''}
  </div>`;
}

function renderList(onlyBugs) {
  const src = onlyBugs ? items.filter(x => x.mark === '!') : items;
  if (!src.length) return `<p class="empty">${onlyBugs ? 'バグはまだ無い' : '項目なし'}</p>`;
  const groups = {};
  src.forEach(x => (groups[x.sec] ||= []).push(x));
  return `<div class="list">${Object.entries(groups).map(([s, xs]) => `<section><h2>${esc(s)}</h2><ul>${xs.map(x =>
    `<li><button data-pick="${esc(x.name)}">${markChip(x.mark)}<span><span class="nm">${esc(x.name)}</span>${x.bugs.map(b => `<span class="bn">${esc(b)}</span>`).join('')}</span></button></li>`).join('')}</ul></section>`).join('')}</div>`;
}

function renderSetup(err) {
  return `<div class="card setup">
    <h2 class="name" style="font-size:22px">最初に1回だけ</h2>
    <p>GitHub のトークンを入れると、ボタンを押すたびに <code>${OWNER}/${REPO}</code> の <code>${PATH}</code> に commit される。</p>
    <ol>
      <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Fine-grained token を作る</a></li>
      <li>Repository access: <b>Only select repositories</b> → <code>${REPO}</code></li>
      <li>Permissions → Repository → <b>Contents: Read and write</b></li>
      <li>作ったトークンを下に貼る (この端末のブラウザにだけ保存)</li>
    </ol>
    <input type="password" id="tok" placeholder="github_pat_..." autocomplete="off">
    ${err ? `<div class="err">${esc(err)}</div>` : ''}
    <div class="btnrow"><button class="btn" id="tokSave">保存して始める</button></div>
  </div>`;
}

function render(err) {
  if (!token) {
    $('#main').innerHTML = renderSetup(err);
    $('#actions').hidden = true; $('#foot').hidden = true; $('#stats').textContent = 'トークン未設定';
    return;
  }
  renderHead();
  $('#main').innerHTML = tab === 'now' ? renderNow() : renderList(tab === 'bugs');
  $('#foot').hidden = false;
  $('#src').textContent = `${OWNER}/${REPO} · ${PATH}`;
  const showAct = tab === 'now' && current();
  $('#actions').hidden = !showAct;
  $('#bOk').disabled = $('#bBug').disabled = $('#bLater').disabled = busy;
  $('#bUndo').disabled = busy || !undo.length;
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; bugOpen = false; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.step != null) { const i = +t.dataset.step; checked.has(i) ? checked.delete(i) : checked.add(i); render(); return; }
  if (t.dataset.tag != null) {
    const i = +t.dataset.tag, txt = $('#bugText').value;
    bugTags.has(i) ? bugTags.delete(i) : bugTags.add(i); render(); $('#bugText').value = txt; return;
  }
  if (t.dataset.pick) { pick = t.dataset.pick; tab = 'now'; bugOpen = false; checked = new Set(); render(); window.scrollTo(0, 0); return; }
  switch (t.id) {
    case 'bOk': act('ok'); break;
    case 'bBug': case 'bugSend': act('bug'); break;
    case 'bLater': act('later'); break;
    case 'bUndo': doUndo(); break;
    case 'bugCancel': bugOpen = false; render(); break;
    case 'reload': safeLoad().then(() => { render(); toast('読み直した'); }); break;
    case 'logout': token = null; store.set('gh_token', null); render(); break;
    case 'tokSave': saveToken(); break;
  }
});

document.addEventListener('keydown', e => {
  if (!token || tab !== 'now' || e.ctrlKey || e.metaKey || e.altKey) return;
  const inField = /^(TEXTAREA|INPUT)$/.test(document.activeElement?.tagName);
  if (inField) {
    if (e.key === 'Enter' && !e.shiftKey && bugOpen) { e.preventDefault(); act('bug'); }
    if (e.key === 'Escape' && bugOpen) { bugOpen = false; render(); }
    return;
  }
  if (e.target.closest?.('button') && e.key === 'Enter') return;
  const k = e.key.toLowerCase();
  if (k === 'enter') { e.preventDefault(); act('ok'); }
  else if (k === 'x') act('bug');
  else if (k === 's') act('later');
  else if (k === 'b') doUndo();
  else if (k === 'escape' && bugOpen) { bugOpen = false; render(); }
  else if (bugOpen && /^[1-7]$/.test(k)) { const i = +k - 1; bugTags.has(i) ? bugTags.delete(i) : bugTags.add(i); render(); }
});

async function saveToken() {
  const v = ($('#tok').value || '').trim(); if (!v) return;
  token = v;
  try { await load(); store.set('gh_token', v); render(); }
  catch (e) { token = null; render(e.message); }
}

(async () => {
  if (!token) return render();
  try { await load(); render(); }
  catch (e) { if (e.status === 401) { token = null; store.set('gh_token', null); render(e.message); } else { $('#stats').textContent = e.message; } }
})();
</script>
</body>
</html>
